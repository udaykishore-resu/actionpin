<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ActionPin</title>
    <style>
      :root { color-scheme: light dark; --fg: #1f2328; --mut: #59636e; --bg: #ffffff; --line: #d1d9e0; --btn: #1f6feb; --ok: #1a7f37; --warn: #8a5a00; --bad: #c21f2b; --chip: #f3f5f7; }
      @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --mut: #9198a1; --bg: #161b22; --line: #3d444d; --btn: #2f81f7; --ok: #3fb950; --warn: #d29922; --bad: #ff7b72; --chip: #21262d; } }
      body { margin: 0; padding: 14px; width: 340px; background: var(--bg); color: var(--fg); font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      h1 { font-size: 15px; margin: 0 0 6px; }
      p { margin: 0 0 10px; }
      .mut { color: var(--mut); }
      a { color: var(--btn); }
      code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
      ul { list-style: none; margin: 0 0 10px; padding: 0; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
      li { padding: 6px 8px; border-bottom: 1px solid var(--line); }
      li:last-child { border-bottom: 0; }
      .spec { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
      .ok { color: var(--ok); } .warn { color: var(--warn); } .danger { color: var(--bad); }
      .label { font-weight: 600; }
      button { width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: var(--btn); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1>ActionPin</h1>
    <p id="status" role="status" aria-live="polite">Checking this tab…</p>
    <ul id="rows" hidden></ul>
    <button id="show" type="button" hidden>Show fixes on the page</button>
    <p id="hint" class="mut" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
